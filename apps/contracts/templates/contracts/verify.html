{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-md">
  <h1 class="mb-1 text-2xl font-semibold">Confirm your signature</h1>
  <p class="mb-4 text-sm text-slate-500">We sent a 6-digit code to <strong>{{ email }}</strong>.</p>
  <form method="post" class="card space-y-4">{% csrf_token %}
    {% include "partials/field.html" with field=form.code %}
    <button class="btn-primary w-full">Sign agreement</button>
  </form>
  <form method="post" action="{% url 'contracts:resend' %}" class="mt-3 text-center">{% csrf_token %}<button class="link text-sm">Send a new code</button></form>
</div>
{% endblock %}
