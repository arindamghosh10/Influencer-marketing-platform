[project]
name = "influencer-platform"
version = "0.1.0"
description = "Marketplace connecting brands with nano/micro creators for UGC campaigns"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "celery[redis]>=5.6.3",
    "cryptography>=50.0.1",
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "django-htmx>=1.29.0",
    "django-tailwind-cli>=4.8.1",
    "dnspython>=2.8.0",
    "extruct>=0.18.0",
    "google-genai>=2.25.0",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["**/migrations/**", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "SIM"]
ignore = ["SIM905"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
]
