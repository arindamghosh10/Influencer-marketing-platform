{# Usage: {% include "partials/field.html" with field=form.x %} #}
<div>
  {% if field.field.widget.input_type == "checkbox" %}
    <label class="flex items-start gap-2 text-sm text-slate-700">{{ field }} <span>{{ field.label }}</span></label>
  {% else %}
    <label class="label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-rose-500">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="help">{{ field.help_text|safe }}</p>{% endif %}
  {% for e in field.errors %}<p class="error">{{ e }}</p>{% endfor %}
</div>
