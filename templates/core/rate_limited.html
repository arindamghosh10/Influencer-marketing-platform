{% extends "base.html" %}
{% block title %}Too many attempts · {{ PLATFORM_NAME }}{% endblock %}
{% block content %}
<div class="card mx-auto max-w-md text-center">
  <h1 class="text-xl font-semibold">Too many attempts</h1>
  <p class="mt-2 text-sm text-slate-600">For your security we've paused this for a little while. Please try again in about {{ minutes }} minute{{ minutes|pluralize }}.</p>
  <a href="javascript:history.back()" class="btn-secondary mt-4">Go back</a>
</div>
{% endblock %}
