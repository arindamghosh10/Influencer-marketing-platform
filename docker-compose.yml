# Local/production stack: web, background worker, scheduler, Postgres (+pgvector), Redis.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: influencer
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d influencer"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://app:app@db:5432/influencer
      REDIS_URL: redis://redis:6379/0
    command: sh -c "uv run --no-dev python manage.py migrate && uv run --no-dev gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports: ["8000:8000"]
    volumes: [media:/app/media]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://app:app@db:5432/influencer
      REDIS_URL: redis://redis:6379/0
    command: uv run --no-dev celery -A config worker -l info
    volumes: [media:/app/media]
    depends_on: [db, redis]
  beat:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://app:app@db:5432/influencer
      REDIS_URL: redis://redis:6379/0
    command: uv run --no-dev celery -A config beat -l info
    depends_on: [db, redis]
volumes:
  pgdata:
  media:
